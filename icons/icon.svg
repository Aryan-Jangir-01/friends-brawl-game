<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#neon)" stroke-width="8" opacity="0.6"/>

  <!-- Crosshairs / Arena Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00f0ff" stroke-width="6" stroke-dasharray="24 16" opacity="0.4"/>
  <circle cx="256" cy="256" r="110" fill="rgba(0, 240, 255, 0.05)" stroke="#00f0ff" stroke-width="4" opacity="0.8"/>

  <!-- Brawler Hero Visor & Helm -->
  <g filter="url(#glow)">
    <!-- Helmet base -->
    <circle cx="256" cy="256" r="70" fill="#00f0ff"/>
    <circle cx="256" cy="256" r="70" fill="none" stroke="#ffffff" stroke-width="8"/>
    
    <!-- Cyber Visor -->
    <path d="M 230 236 Q 280 236 295 256 Q 280 276 230 276 Z" fill="#090d16"/>
    <!-- Visor Eye Glow -->
    <circle cx="265" cy="256" r="12" fill="#ff007f"/>
    <circle cx="265" cy="256" r="6" fill="#ffffff"/>

    <!-- Dual Blasters -->
    <rect x="310" y="244" width="60" height="24" rx="6" fill="#334155" stroke="#00f0ff" stroke-width="4"/>
    <rect x="360" y="248" width="16" height="16" rx="3" fill="#ff007f"/>
  </g>

  <!-- Title Monogram -->
  <text x="256" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="6">BRAWL ZONE</text>
</svg>

